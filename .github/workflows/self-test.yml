name: Self Test

# Acceptance test for the three actions in this repository. It scaffolds a
# throwaway Flutter app and drives the actions through it with the local action
# paths (`./setup`, `./package`, `./publish`), so the working tree is what gets
# tested. Nothing is published anywhere: the `custom` publisher target only
# lists the artifact it was handed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: deb,appimage
            verify: ls -l $ARTIFACT_PATH
          - os: macos-latest
            platform: macos
            target: dmg
            verify: ls -l $ARTIFACT_PATH
          - os: windows-latest
            platform: windows
            target: zip
            # `dir` reads the `/` in fastforge's Windows paths as a switch, so
            # check the artifact with `if exist` instead.
            verify: if exist %ARTIFACT_PATH% (echo %ARTIFACT_PATH%) else (exit /b 1)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool

          # GitHub runners have no FUSE, so let the tool unpack itself instead of
          # mounting the AppImage.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Create a throwaway app
        run: flutter create --platforms=${{ matrix.platform }} sandbox

      - name: Configure the AppImage metadata
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          # `appimagetool` insists on a `Categories` entry and an AppDir icon, so
          # a project that packages an AppImage ships `linux/packaging/appimage`.
          mkdir -p sandbox/linux/packaging/appimage
          cat > sandbox/linux/packaging/appimage/make_config.yaml <<'YAML'
          display_name: Sandbox
          icon: icon.png
          generic_name: Self test application
          categories:
            - Utility
          YAML

          python3 - <<'PY'
          import struct
          import zlib

          size = 256
          raw = b"".join(b"\x00" + bytes([0x42, 0x8D, 0xE9]) * size for _ in range(size))


          def chunk(kind, data):
              body = kind + data
              return (
                  struct.pack(">I", len(data))
                  + body
                  + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              )


          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )
          open("sandbox/icon.png", "wb").write(png)
          PY

      - name: Set up Fastforge
        id: setup
        uses: ./setup

      - name: Check the installed version
        shell: bash
        run: |
          set -euo pipefail

          printf 'setup output: %s\n' "${{ steps.setup.outputs.version }}"
          fastforge --version

      - name: Package
        id: package
        uses: ./package
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          working-directory: sandbox
          artifact-name: "sandbox-{{build_name}}+{{build_number}}-{{platform}}.{{ext}}"
          skip-clean: "true"
          dart-define: '{"SELF_TEST":"true"}'

      - name: Check the packaged artifacts
        shell: bash
        run: |
          set -euo pipefail

          paths="${{ steps.package.outputs.artifact-paths }}"
          printf 'artifact-paths: %s\n' "$paths"
          printf 'artifact-count: %s\n' "${{ steps.package.outputs.artifact-count }}"
          printf 'output-directory: %s\n' "${{ steps.package.outputs.output-directory }}"

          count=0
          IFS=',' read -r -a artifacts <<< "$paths"
          for artifact in "${artifacts[@]}"; do
            # fastforge reports Windows paths with backslashes.
            artifact="$(printf '%s' "$artifact" | tr '\\' '/')"
            if [ ! -f "sandbox/$artifact" ]; then
              echo "::error::Missing artifact: sandbox/$artifact"
              exit 1
            fi
            count=$((count + 1))
          done

          if [ "$count" != "${{ steps.package.outputs.artifact-count }}" ]; then
            echo "::error::artifact-count does not match artifact-paths"
            exit 1
          fi

      - name: Publish with the custom target
        id: publish
        uses: ./publish
        with:
          path: ${{ steps.package.outputs.artifact-paths }}
          target: custom
          working-directory: sandbox
          publish-args: '{"command":"${{ matrix.verify }}"}'

      - name: Check the publish output
        shell: bash
        run: |
          set -euo pipefail

          message="${{ steps.publish.outputs.message }}"
          printf 'publish message: %s\n' "$message"

          if ! printf '%s' "$message" | grep -q 'sandbox'; then
            echo "::error::publish did not report the artifact it was given"
            exit 1
          fi
